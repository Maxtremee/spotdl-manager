services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: spotdl-manager-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for live reloading
      - ./src:/app/src
      - ./server:/app/server
      - ./public:/app/public
      - ./drizzle:/app/drizzle
      - ./test:/app/test
      # Config files
      - ./vite.config.ts:/app/vite.config.ts
      - ./panda.config.ts:/app/panda.config.ts
      - ./drizzle.config.ts:/app/drizzle.config.ts
      - ./biome.jsonc:/app/biome.jsonc
      - ./postcss.config.cjs:/app/postcss.config.cjs
      - ./components.json:/app/components.json
      - ./app.config.ts:/app/app.config.ts
      # Persist data directory (logs, sync files, downloads)
      - ./data:/app/data
      # Persist database
      - ./data.db:/app/data.db
    environment:
      # Database location

      # Node environment
      - NODE_ENV=development
      # Optional: App title
      - VITE_APP_TITLE=spotdl-manager (Docker Dev)
      # Optional: Server URL
      - SERVER_URL=http://localhost:3000
    stdin_open: true
    tty: true
    # Restart policy for development
    restart: unless-stopped
